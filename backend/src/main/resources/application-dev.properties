# Base de donnees H2 en memoire (mode PostgreSQL) : aucune installation necessaire en local
# DB_CLOSE_DELAY=-1 : la base reste en vie meme si toutes les connexions se ferment (mise en veille du PC)
spring.datasource.url=jdbc:h2:mem:devmanager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
spring.h2.console.enabled=true
