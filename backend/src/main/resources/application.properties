spring.application.name=devmanager
server.port=${PORT:8080}

# Profil actif : "dev" par defaut (H2 en memoire), "prod" en production (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false

# JWT : en production, JWT_SECRET doit etre une cle longue et secrete (32 caracteres minimum)
app.jwt.secret=${JWT_SECRET:dev-secret-key-a-changer-en-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend : utilise pour le CORS et le lien de reinitialisation du mot de passe
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=30

# Emails (Brevo) : sans cle, le lien de reinitialisation est affiche dans les logs
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.sender-email=${MAIL_SENDER_EMAIL:no-reply@devmanager.local}
app.mail.sender-name=${MAIL_SENDER_NAME:DevManager}
