server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels a l'API sont transmis au conteneur du backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application monopage : toute autre URL renvoie index.html (React Router prend le relais)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers generes par Vite (nom avec empreinte) : mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
